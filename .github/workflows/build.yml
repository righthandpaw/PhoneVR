# =============================================================================
#  PhoneVR CI Build
#  Runs on every push and pull request.
#
#  Jobs:
#   • build-windows  — SteamVR driver DLL (Visual Studio on Windows)
#   • build-android  — Android APK (Ubuntu)
# =============================================================================
name: Build PhoneVR

on:
  push:
    branches: [ master, main, "dev/**" ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:   # allows manual trigger from the Actions tab

jobs:

  # ── Windows — SteamVR driver ─────────────────────────────────────────────
  build-windows:
    name: Windows SteamVR Driver
    runs-on: windows-2019   # has Visual Studio 2019 pre-installed

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.vcxproj') }}

      - name: Build x64 Release
        working-directory: code/windows
        run: |
          msbuild PhoneVR.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m /verbosity:minimal
        shell: pwsh

      - name: Build Win32 Release
        working-directory: code/windows
        run: |
          msbuild PhoneVR.sln `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /m /verbosity:minimal
        shell: pwsh

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PVRServer-x64
          path: code/windows/build/x64/
          if-no-files-found: warn

      - name: Upload Win32 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PVRServer-Win32
          path: code/windows/build/Win32/
          if-no-files-found: warn

  # ── Android — APK ────────────────────────────────────────────────────────
  build-android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive   # critical — pulls ALVR and other submodules

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r25c
        run: sdkmanager "ndk;25.2.9519653"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            code/mobile/android/PhoneVR/ALVR/target
          key: cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Prepare ALVR dependencies
        working-directory: code/mobile/android/PhoneVR
        run: bash prepare-alvr-deps.sh nogvr
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653

      - name: Make Gradle wrapper executable
        working-directory: code/mobile/android/PhoneVR
        run: chmod +x ./gradlew

      - name: Build noGvr Release APK
        working-directory: code/mobile/android/PhoneVR
        run: ./gradlew assembleNoGvrRelease --no-daemon -x lint
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneVR-noGvr-APK
          path: code/mobile/android/PhoneVR/app/build/outputs/apk/noGvr/release/*.apk
          if-no-files-found: warn
